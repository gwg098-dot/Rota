<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gerador de Minutas — TI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<style>
  :root {
    --accent: #cc0000;
    --accent-light: rgba(204,0,0,0.08);
    --bg: #f2f2f5;
    --surface: #ffffff;
    --surface2: #f7f7fa;
    --border: #e0e0e6;
    --text: #1a1a2e;
    --text2: #5a5a72;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  /* ── HEADER ── */
  .header {
    max-width: 860px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-circle {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-circle svg { width: 24px; height: 24px; fill: #fff; }
  .header-text h1 { font-size: 20px; font-weight: 700; }
  .header-text p  { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* ── MAIN ── */
  .main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 14px;
  }
  .section-sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* ── FIELDS ── */
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text2); }
  .field input, .field select, .field textarea {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .18s;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field input[readonly] { color: var(--text2); cursor: default; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .row-auto { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }

  /* ── TIPO ROTA ── */
  .tipo-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .tipo-btn {
    background: var(--surface2); border: 2px solid var(--border);
    border-radius: 10px; padding: 10px 16px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--text2); transition: all .18s; text-align: center;
  }
  .tipo-btn:hover { border-color: var(--accent); color: var(--text); }
  .tipo-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--text); }

  /* ── DROPDOWN BUSCÁVEL ── */
  .dd-wrap { position: relative; margin-top: 4px; }
  .dd-display {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 9px; padding: 9px 12px; cursor: pointer;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center;
    user-select: none; transition: border-color .18s;
  }
  .dd-display:hover { border-color: var(--accent); }
  .dd-display.open { border-color: var(--accent); border-radius: 9px 9px 0 0; }
  .dd-arrow { font-size: 11px; color: var(--text2); transition: transform .2s; }
  .dd-display.open .dd-arrow { transform: rotate(180deg); }
  .dd-list-wrap {
    display: none; position: absolute; z-index: 200;
    width: 100%; background: var(--surface);
    border: 1.5px solid var(--accent); border-top: none;
    border-radius: 0 0 9px 9px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 240px; overflow: hidden;
    flex-direction: column;
  }
  .dd-list-wrap.open { display: flex; }
  .dd-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); }
  .dd-search-wrap input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 7px; padding: 7px 10px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; width: 100%; outline: none;
  }
  .dd-search-wrap input:focus { border-color: var(--accent); }
  .dd-list { list-style: none; overflow-y: auto; flex: 1; }
  .dd-list li {
    padding: 9px 14px; font-size: 13px; cursor: pointer;
    transition: background .12s; color: var(--text);
  }
  .dd-list li:hover { background: var(--accent-light); }
  .dd-list li.active { background: var(--accent-light); font-weight: 600; color: var(--accent); }
  .dd-list li.hidden { display: none; }

  /* ── BLOCO ENDEREÇO ── */
  .addr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .addr-block {
    background: var(--surface2); border-radius: 10px;
    border: 1.5px solid var(--border); padding: 14px 16px;
  }
  .addr-block-title {
    font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .addr-block-title.rem { color: #1a7acc; }
  .addr-block-title.dest { color: #cc6600; }
  .addr-field { margin-bottom: 8px; }
  .addr-field:last-child { margin-bottom: 0; }
  .addr-field label { font-size: 11px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 3px; }
  .addr-field input {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 7px; padding: 7px 10px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    color: var(--text); width: 100%; outline: none; transition: border-color .18s;
  }
  .addr-field input:focus { border-color: var(--accent); }
  .addr-field input[readonly] { color: var(--text2); background: #f0f0f4; cursor: default; }

  /* ── TABELA DE ITENS ── */
  .itens-header {
    display: grid;
    grid-template-columns: 110px 1fr 130px 70px 100px 36px;
    gap: 8px; padding: 0 4px 6px;
    font-size: 11px; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1.5px solid var(--border); margin-bottom: 8px;
  }
  .item-row {
    display: grid;
    grid-template-columns: 110px 1fr 130px 70px 100px 36px;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .item-row input, .item-row select {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    color: var(--text); width: 100%; outline: none; transition: border-color .18s;
  }
  .item-row input:focus, .item-row select:focus { border-color: var(--accent); }
  .item-row input[readonly] { color: var(--text2); background: #f0f0f4; cursor: default; }

  /* produto dropdown inline */
  .prod-wrap { position: relative; }
  .prod-display {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 8px 10px; cursor: pointer;
    font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    user-select: none; transition: border-color .18s; min-height: 38px;
  }
  .prod-display:hover { border-color: var(--accent); }
  .prod-display.open { border-color: var(--accent); border-radius: 8px 8px 0 0; }
  .prod-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; font-size: 12px; }
  .prod-arrow { font-size: 10px; color: var(--text2); margin-left: 4px; flex-shrink: 0; transition: transform .2s; }
  .prod-display.open .prod-arrow { transform: rotate(180deg); }
  .prod-list-wrap {
    display: none; position: absolute; z-index: 300;
    width: 280px; background: var(--surface);
    border: 1.5px solid var(--accent); border-top: none;
    border-radius: 0 0 9px 9px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    max-height: 200px; overflow: hidden; flex-direction: column;
    left: 0; top: 100%;
  }
  .prod-list-wrap.open { display: flex; }
  .prod-search-wrap { padding: 6px; border-bottom: 1px solid var(--border); }
  .prod-search-wrap input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 6px; padding: 6px 9px;
    font-size: 12px; font-family: 'DM Sans', sans-serif; width: 100%; outline: none;
  }
  .prod-list { list-style: none; overflow-y: auto; flex: 1; }
  .prod-list li { padding: 7px 12px; font-size: 12px; cursor: pointer; transition: background .12s; }
  .prod-list li:hover { background: var(--accent-light); }
  .prod-list li.active { background: var(--accent-light); font-weight: 600; color: var(--accent); }
  .prod-list li.hidden { display: none; }

  .btn-del {
    background: none; border: 1.5px solid var(--border);
    border-radius: 8px; cursor: pointer; padding: 6px 8px;
    color: var(--text2); font-size: 15px; transition: all .15s;
    display: flex; align-items: center; justify-content: center; height: 38px;
  }
  .btn-del:hover { background: #ffe5e5; border-color: var(--accent); color: var(--accent); }

  .btn-add-item {
    background: none; border: 1.5px dashed var(--border);
    border-radius: 9px; padding: 9px 16px; cursor: pointer;
    font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 600;
    color: var(--text2); width: 100%; transition: all .18s; margin-top: 4px;
  }
  .btn-add-item:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── RODAPÉ CAMPOS ── */
  .footer-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── BOTÃO GERAR ── */
  .btn-gerar {
    width: 100%; padding: 15px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: .02em; transition: background .18s, transform .1s;
    box-shadow: 0 4px 18px rgba(204,0,0,0.25);
  }
  .btn-gerar:hover { background: #a80000; }
  .btn-gerar:active { transform: scale(.98); }

  /* ── SCANNER ── */
  .btn-scan {
    flex-shrink: 0; width: 38px; height: 38px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; cursor: pointer; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s;
  }
  .btn-scan:hover { border-color: var(--accent); background: var(--accent-light); }

  .scanner-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 9000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; gap: 16px;
  }
  .scanner-inner {
    background: #000; border-radius: 14px; overflow: hidden;
    width: 100%; max-width: 420px; position: relative;
  }
  .scanner-inner video { width: 100%; display: block; max-height: 60vh; object-fit: cover; }
  .scanner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .scanner-line {
    width: 70%; height: 2px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: scanline 2s ease-in-out infinite;
  }
  @keyframes scanline {
    0%, 100% { transform: translateY(-60px); opacity: .6; }
    50%       { transform: translateY(60px);  opacity: 1;  }
  }
  .scanner-label {
    color: #fff; font-size: 14px; font-weight: 600; text-align: center;
    background: rgba(0,0,0,0.5); padding: 8px 18px; border-radius: 8px;
  }
  .btn-scan-close {
    padding: 11px 28px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px;
  }

  /* ── BTN REGEN ── */
  .btn-regen {
    flex-shrink: 0; padding: 9px 14px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 9px; cursor: pointer; font-size: 12px; font-weight: 600;
    color: var(--text2); font-family: 'DM Sans', sans-serif;
    transition: all .18s; white-space: nowrap;
  }
  .btn-regen:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #fff; border-radius: 10px;
    padding: 12px 22px; font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9999;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 640px) {
    .addr-grid { grid-template-columns: 1fr; }
    .row2, .row3, .footer-fields { grid-template-columns: 1fr; }
    .itens-header { display: none; }
    .item-row { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; }
    .item-row > *:nth-child(1) { grid-column: 1/3; }
    .item-row > *:nth-child(2) { grid-column: 1/3; }
    .tipo-group { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-circle">
    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-1 14H5V7h14v11zM7 9h10v2H7zm0 4h7v2H7z"/></svg>
  </div>
  <div class="header-text">
    <h1>Gerador de Minutas</h1>
    <p>Grupo Fleury · TI End User</p>
  </div>
  <a href="Gestao_Minutas.html" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;text-decoration:none;transition:all .18s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text2)'">← Gestão</a>
</div>

<div class="main">

  <!-- TIPO DE ROTA -->
  <div class="card">
    <div class="card-title">Tipo de Rota</div>
    <div class="tipo-group">
      <button class="tipo-btn active" id="tipo-entrega" onclick="setTipo('Entrega')">📦 Entrega</button>
      <button class="tipo-btn" id="tipo-devolucao" onclick="setTipo('Devolucao')">↩ Devolução</button>
    </div>
  </div>

  <!-- ID / DATA -->
  <div class="card">
    <div class="card-title">Identificação</div>
    <div class="row2">
      <div class="field">
        <label>ID Rota</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="id-chamado" readonly style="font-family:monospace;font-size:13px;letter-spacing:.04em;flex:1;background:#f0f0f4;color:var(--text2);"/>
          <button onclick="gerarIdRota()" class="btn-regen">↺ Gerar novo</button>
        </div>
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="id-data"/>
      </div>
    </div>
  </div>

  <!-- REMETENTE / DESTINATÁRIO -->
  <div class="card">
    <div class="card-title">Remetente e Destinatário</div>
    <div class="addr-grid">
      <!-- REMETENTE -->
      <div>
        <div class="addr-block-title rem">Remetente</div>
        <div class="field">
          <label>Unidade</label>
          <div class="dd-wrap" id="ddw-rem">
            <div class="dd-display" id="dd-rem-display" onclick="toggleDD('rem')">
              <span id="dd-rem-text">Selecionar...</span>
              <span class="dd-arrow">▾</span>
            </div>
            <div class="dd-list-wrap" id="dd-rem-list-wrap">
              <div class="dd-search-wrap"><input type="text" id="dd-rem-search" placeholder="Buscar unidade..." oninput="filterDD('rem')" autocomplete="off"/></div>
              <ul class="dd-list" id="dd-rem-list"></ul>
            </div>
          </div>
        </div>
        <div class="addr-field"><label>Endereço</label><input type="text" id="rem-end" readonly/></div>
        <div class="row2">
          <div class="addr-field"><label>Bairro</label><input type="text" id="rem-bairro" readonly/></div>
          <div class="addr-field"><label>Cidade</label><input type="text" id="rem-cidade" readonly/></div>
        </div>
        <div class="row3">
          <div class="addr-field"><label>UF</label><input type="text" id="rem-uf" readonly/></div>
          <div class="addr-field"><label>CEP</label><input type="text" id="rem-cep" readonly/></div>
          <div class="addr-field"><label>C. Custo</label><input type="text" id="rem-cc" readonly/></div>
        </div>
        <div class="addr-field"><label>CNPJ</label><input type="text" id="rem-cnpj" readonly/></div>
      </div>
      <!-- DESTINATÁRIO -->
      <div>
        <div class="addr-block-title dest">Destinatário</div>
        <div class="field">
          <label>Unidade</label>
          <div class="dd-wrap" id="ddw-dest">
            <div class="dd-display" id="dd-dest-display" onclick="toggleDD('dest')">
              <span id="dd-dest-text">Selecionar...</span>
              <span class="dd-arrow">▾</span>
            </div>
            <div class="dd-list-wrap" id="dd-dest-list-wrap">
              <div class="dd-search-wrap"><input type="text" id="dd-dest-search" placeholder="Buscar unidade..." oninput="filterDD('dest')" autocomplete="off"/></div>
              <ul class="dd-list" id="dd-dest-list"></ul>
            </div>
          </div>
        </div>
        <div class="addr-field"><label>Endereço</label><input type="text" id="dest-end" readonly/></div>
        <div class="row2">
          <div class="addr-field"><label>Bairro</label><input type="text" id="dest-bairro" readonly/></div>
          <div class="addr-field"><label>Cidade</label><input type="text" id="dest-cidade" readonly/></div>
        </div>
        <div class="row3">
          <div class="addr-field"><label>UF</label><input type="text" id="dest-uf" readonly/></div>
          <div class="addr-field"><label>CEP</label><input type="text" id="dest-cep" readonly/></div>
          <div class="addr-field"><label>C. Custo</label><input type="text" id="dest-cc" readonly/></div>
        </div>
        <div class="addr-field"><label>CNPJ</label><input type="text" id="dest-cnpj" readonly/></div>
      </div>
    </div>
  </div>

  <!-- ITENS -->
  <div class="card">
    <div class="card-title">Itens</div>
    <div class="itens-header">
      <div>Nº Chamado</div>
      <div>Produto</div>
      <div>TAG / Serial</div>
      <div>Qtd</div>
      <div>Valor Unit.</div>
      <div></div>
    </div>
    <div id="itens-container"></div>
    <button class="btn-add-item" onclick="addItem()">+ Adicionar item</button>
  </div>

  <!-- TRANSPORTE / RESPONSÁVEIS -->
  <div class="card">
    <div class="card-title">Transporte e Responsáveis</div>
    <div class="row2">
      <div class="field">
        <label>Transportadora</label>
        <input type="text" id="transportadora" value="VELOX"/>
      </div>
      <div class="field">
        <label>Tipo do Produto</label>
        <input type="text" id="tipo-produto" value="Equipamentos T.I"/>
      </div>
    </div>
    <hr class="section-sep"/>
    <div class="footer-fields">
      <div class="field"><label>Encaminhado por</label><input type="text" id="encaminhado-por" placeholder="Nome completo"/></div>
      <div class="field"><label>Solicitado por</label><input type="text" id="solicitado-por" placeholder="Nome completo"/></div>
    </div>
  </div>

  <!-- GERAR -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
  <button class="btn-gerar" onclick="enviarParaAssinatura()" style="background:#1a7acc;box-shadow:0 4px 18px rgba(26,122,204,0.25);">
    ✉ Enviar para Assinatura
  </button>
  <button class="btn-gerar" onclick="gerarPDF()">
    ⬇ Gerar PDF (sem assinatura)
  </button>
</div>
<button class="btn-gerar" onclick="salvarNaGestao()" style="background:#0a6640;box-shadow:0 4px 18px rgba(10,102,64,0.25);">
  💾 Salvar na Gestão
</button>

</div><!-- /main -->

<div id="toast"></div>

<script>
// ─────────────────────────────────────────
// SUPABASE
// ─────────────────────────────────────────
const SUPA_URL = 'https://ipljdqgzzxtefiziptis.supabase.co';
const SUPA_KEY = 'sb_publishable_yilYz_KyV-62HueBsPNvOA_cRre6Qda';

async function supaInsert(data) {
  const r = await fetch(`${SUPA_URL}/rest/v1/minutas`, {
    method: 'POST',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },

let tipo = 'Entrega';
let itemCount = 0;
let selRem = null, selDest = null;

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
window.addEventListener('click', e => {
  // fechar dropdowns ao clicar fora
  ['rem','dest'].forEach(side => {
    const wrap = document.getElementById(`ddw-${side}`);
    if (wrap && !wrap.contains(e.target)) closeDD(side);
  });
  // fechar prod dropdowns
  document.querySelectorAll('.prod-list-wrap.open').forEach(el => {
    if (!el.closest('.prod-wrap').contains(e.target)) {
      el.classList.remove('open');
      el.closest('.prod-wrap').querySelector('.prod-display').classList.remove('open');
    }
  });
});

// ─────────────────────────────────────────
// ID ROTA
// ─────────────────────────────────────────
function gerarIdRota() {
  const now = new Date();
  const date = now.getFullYear().toString() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0');
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem 0,O,1,I ambiguos
  let rand = '';
  for (let i = 0; i < 4; i++) rand += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('id-chamado').value = `ROT-${date}-${rand}`;
}

document.addEventListener('DOMContentLoaded', () => {
  // data hoje + ID Rota inicial
  const hoje = new Date();
  document.getElementById('id-data').value = hoje.toISOString().split('T')[0];
  gerarIdRota();
  buildDD('rem');
  buildDD('dest');
  addItem();
});

// ─────────────────────────────────────────
// TIPO ROTA
// ─────────────────────────────────────────
function setTipo(t) {
  tipo = t;
  document.getElementById('tipo-entrega').classList.toggle('active', t === 'Entrega');
  document.getElementById('tipo-devolucao').classList.toggle('active', t === 'Devolucao');
}

// ─────────────────────────────────────────
// DROPDOWNS DE ENDEREÇO
// ─────────────────────────────────────────
function buildDD(side) {
  const ul = document.getElementById(`dd-${side}-list`);
  ul.innerHTML = '';
  const sorted = [...ENDERECOS].sort((a,b) => a.u.localeCompare(b.u));
  sorted.forEach(addr => {
    const li = document.createElement('li');
    li.textContent = addr.u;
    li.onclick = () => selectAddr(side, addr);
    ul.appendChild(li);
  });
}

function toggleDD(side) {
  const wrap = document.getElementById(`dd-${side}-list-wrap`);
  const disp = document.getElementById(`dd-${side}-display`);
  const isOpen = wrap.classList.contains('open');
  // fecha o outro
  ['rem','dest'].forEach(s => { if(s!==side) closeDD(s); });
  if (isOpen) { closeDD(side); }
  else {
    wrap.classList.add('open');
    disp.classList.add('open');
    setTimeout(() => document.getElementById(`dd-${side}-search`).focus(), 50);
  }
}

function closeDD(side) {
  document.getElementById(`dd-${side}-list-wrap`).classList.remove('open');
  document.getElementById(`dd-${side}-display`).classList.remove('open');
}

function filterDD(side) {
  const q = document.getElementById(`dd-${side}-search`).value.toLowerCase();
  document.querySelectorAll(`#dd-${side}-list li`).forEach(li => {
    li.classList.toggle('hidden', !li.textContent.toLowerCase().includes(q));
  });
}

function selectAddr(side, addr) {
  if (side === 'rem') selRem = addr; else selDest = addr;
  document.getElementById(`dd-${side}-text`).textContent = addr.u;
  document.getElementById(`${side}-end`).value   = addr.e;
  document.getElementById(`${side}-bairro`).value = addr.b;
  document.getElementById(`${side}-cidade`).value = addr.c;
  document.getElementById(`${side}-uf`).value    = addr.uf;
  document.getElementById(`${side}-cep`).value   = addr.cep || '';
  document.getElementById(`${side}-cc`).value    = addr.cc;
  document.getElementById(`${side}-cnpj`).value  = addr.cnpj || '';
  // highlight
  document.querySelectorAll(`#dd-${side}-list li`).forEach(li => {
    li.classList.toggle('active', li.textContent === addr.u);
  });
  closeDD(side);
}

function addItem() {
  itemCount++;
  const id = itemCount;
  const container = document.getElementById('itens-container');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.id = `item-${id}`;
  row.innerHTML = `
    <input type="text" placeholder="Chamado" id="item-${id}-chamado"/>
    <div class="prod-wrap">
      <div class="prod-display" id="prod-${id}-display" onclick="toggleProd(${id})">
        <span class="prod-text" id="prod-${id}-text">Selecionar produto...</span>
        <span class="prod-arrow">▾</span>
      </div>
      <div class="prod-list-wrap" id="prod-${id}-list-wrap">
        <div class="prod-search-wrap"><input type="text" placeholder="Buscar..." oninput="filterProd(${id}, this.value)" autocomplete="off"/></div>
        <ul class="prod-list" id="prod-${id}-list"></ul>
      </div>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
      <input type="text" placeholder="TAG / Serial" id="item-${id}-tag" style="flex:1;min-width:0;"/>
      <button class="btn-scan" onclick="abrirScanner('item-${id}-tag')" title="Escanear código de barras">📷</button>
    </div>
    <input type="number" placeholder="1" min="1" value="1" id="item-${id}-qtd"/>
    <input type="text" placeholder="R$ 0,00" readonly id="item-${id}-valor"/>
    <button class="btn-del" onclick="removeItem(${id})" title="Remover">✕</button>
  `;
  container.appendChild(row);
  buildProdList(id);
}

function removeItem(id) {
  const el = document.getElementById(`item-${id}`);
  if (el) el.remove();
}

function buildProdList(id) {
  const ul = document.getElementById(`prod-${id}-list`);
  MATERIAIS.forEach(m => {
    const li = document.createElement('li');
    li.textContent = m.n;
    li.dataset.nome = m.n;
    li.dataset.valor = m.v;
    li.onclick = () => selectProd(id, m);
    ul.appendChild(li);
  });
}

function toggleProd(id) {
  const wrap = document.getElementById(`prod-${id}-list-wrap`);
  const disp = document.getElementById(`prod-${id}-display`);
  const isOpen = wrap.classList.contains('open');
  // fecha todos os outros
  document.querySelectorAll('.prod-list-wrap.open').forEach(el => {
    el.classList.remove('open');
    el.closest('.prod-wrap').querySelector('.prod-display').classList.remove('open');
  });
  if (!isOpen) {
    wrap.classList.add('open');
    disp.classList.add('open');
    setTimeout(() => wrap.querySelector('input').focus(), 50);
  }
}

function filterProd(id, q) {
  q = q.toLowerCase();
  document.querySelectorAll(`#prod-${id}-list li`).forEach(li => {
    li.classList.toggle('hidden', !li.dataset.nome.toLowerCase().includes(q));
  });
}

function selectProd(id, m) {
  document.getElementById(`prod-${id}-text`).textContent = m.n;
  document.getElementById(`item-${id}-valor`).value = m.v > 0 ? `R$ ${m.v.toLocaleString('pt-BR', {minimumFractionDigits:2})}` : 'R$ 0,00';
  // marca ativo
  document.querySelectorAll(`#prod-${id}-list li`).forEach(li => li.classList.toggle('active', li.dataset.nome === m.n));
  // fecha
  document.getElementById(`prod-${id}-list-wrap`).classList.remove('open');
  document.getElementById(`prod-${id}-display`).classList.remove('open');
}

// ─────────────────────────────────────────
// SANITIZAÇÃO
// ─────────────────────────────────────────
function s(str) {
  if (!str) return '';
  return str
    .replace(/[àáâãäå]/gi, 'a').replace(/[èéêë]/gi, 'e').replace(/[ìíîï]/gi, 'i')
    .replace(/[òóôõö]/gi, 'o').replace(/[ùúûü]/gi, 'u').replace(/[ç]/gi, 'c')
    .replace(/[ñ]/gi, 'n').replace(/[ý]/gi, 'y');
}

// ─────────────────────────────────────────
// GERAR PDF
// ─────────────────────────────────────────
function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const PW = 210, PH = 297;
  const ML = 12, MR = 12;
  const lw = PW - ML - MR;  // 186mm

  // ── helper: desenha label + caixa + valor em coordenadas absolutas ──
  // Retorna a coordenada Y logo após a caixa (cy + labelH + boxH + gap)
  const LABEL_H = 4.5;  // altura reservada para o label
  const BOX_H   = 7;    // altura da caixa
  const GAP     = 2;    // espaço após a caixa antes do próximo elemento

  function fld(label, value, x, fw, cy) {
    // label
    doc.setFontSize(6.5); doc.setFont('helvetica','bold'); doc.setTextColor(110,110,110);
    doc.text(s(label), x + 1.5, cy + 3.5);
    // box
    doc.setDrawColor(215,215,215); doc.setFillColor(248,248,250);
    doc.roundedRect(x, cy + LABEL_H, fw, BOX_H, 1, 1, 'FD');
    // valor
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(25,25,25);
    const maxW = fw - 3;
    let txt = s(value || '');
    while (txt.length > 0 && doc.getTextWidth(txt) > maxW) txt = txt.slice(0, -1);
    doc.text(txt, x + 1.5, cy + LABEL_H + 5);
    return cy + LABEL_H + BOX_H + GAP;
  }

  let y = 12;

    doc.rect(ML, y, lw, 6.5, 'F');

    doc.line(ML, y + 6.5, ML + lw, y + 6.5);

    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(25,25,25);
    const vals = [vChamado, vProd, vTag, vQtd, vValTxt];
    COLS.forEach((c, i) => {
      let t = s(vals[i]);
      const mw = c.w - 3;
      while (t.length > 0 && doc.getTextWidth(t) > mw) t = t.slice(0, -1);
      doc.text(t, COLS_X[i] + 1.5, y + 4.3);
    });
    y += 6.5;
  });

  // Linha de total
  doc.setFillColor(235,235,240);
  doc.rect(ML, y, lw, 7.5, 'F');
  doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(25,25,25);
  doc.text('TOTAL', PW - MR - 35, y + 5);
  doc.text(`R$ ${totalVal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`, PW - MR - 1.5, y + 5, { align: 'right' });
  y += 10;

  // ── TRANSPORTE ──
  const transp   = document.getElementById('transportadora').value;
  const tipoProd = document.getElementById('tipo-produto').value;
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(70,70,70);
  doc.text(`Transportadora: ${s(transp)}`, ML, y + 4);
  doc.text(`Tipo do Produto: ${s(tipoProd)}`, PW - MR, y + 4, { align: 'right' });
  y += 8;

  // ── RESPONSÁVEIS ──
  const hw2 = (lw - 3) / 2;
  fld('ENCAMINHADO POR', document.getElementById('encaminhado-por').value, ML,       hw2, y);
  fld('SOLICITADO POR',  document.getElementById('solicitado-por').value,  ML+hw2+3, hw2, y);
  y += LABEL_H + BOX_H + GAP + 1;

  fld('RECEBEDOR', '', ML,       hw2, y);
  fld('DATA',      '', ML+hw2+3, hw2, y);
  y += LABEL_H + BOX_H + GAP + 1;

  // ── NOTA ISENTA ──
  if (y < PH - 18) {
    doc.setFontSize(6); doc.setFont('helvetica','italic'); doc.setTextColor(140,140,140);
    const nota = 'Isento de emissao de notas fiscais, posto nao ser contribuinte de ICMS com base no Art. 4o, da LC 87/96 (Lei Federal); Art.19, do Decreto Estadual no. 45.490/00 (Estado de SP); Art.15, do Decreto Estadual no. 27.427/00 (Estado do RJ); Art.16, do Decreto Estadual no. 1.980/07 (Estado do PR); Art.36, do Decreto Estadual no. 6.284/97 (Estado da BA); Art.15, do Decreto Estadual no. 14.876/91 (Estado de PE); Art.08, do Decreto Estadual no. 37.699/97, Livro II (Estado do RS)';
    const lines = doc.splitTextToSize(nota, lw);
    doc.text(lines, ML, y + 3);
  }

  // ── SALVAR ──
  const destName = selDest ? selDest.u.replace(/[^a-zA-Z0-9\-]/g,'_').replace(/_+/g,'_') : 'Destinatario';
  const idRota   = (document.getElementById('id-chamado').value || 'SEM-ID').replace(/[^a-zA-Z0-9\-]/g,'_');
  const dateName = (dataRaw || '').replace(/-/g,'');
  const tipoName = tipo === 'Entrega' ? 'Entrega' : 'Devolucao';
  doc.save(`${destName}_${idRota}_${dateName}_${tipoName}.pdf`);
  showToast('PDF gerado com sucesso!');
}

// ─────────────────────────────────────────
// SCANNER DE CÓDIGO DE BARRAS
// ─────────────────────────────────────────
let codeReader = null;
let scannerTargetId = null;

async function abrirScanner(inputId) {
  scannerTargetId = inputId;

  // Cria modal
  const modal = document.createElement('div');
  modal.className = 'scanner-modal';
  modal.id = 'scanner-modal';
  modal.innerHTML = `
    <div class="scanner-inner">
      <video id="scanner-video" autoplay muted playsinline></video>
      <div class="scanner-overlay"><div class="scanner-line"></div></div>
    </div>
    <div class="scanner-label">Aponte a câmera para o código de barras</div>
    <button class="btn-scan-close" onclick="fecharScanner()">✕ Cancelar</button>
  `;
  document.body.appendChild(modal);

  try {
    const ZXing = window.ZXing;
    codeReader = new ZXing.BrowserMultiFormatReader();

    // Lista dispositivos de vídeo
    const devices = await codeReader.listVideoInputDevices();
    // Prefere câmera traseira em mobile
    const device = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[0];
    const deviceId = device ? device.deviceId : undefined;

    await codeReader.decodeFromVideoDevice(deviceId, 'scanner-video', (result, err) => {
      if (result) {
        document.getElementById(scannerTargetId).value = result.getText();
        fecharScanner();
        showToast('Código lido: ' + result.getText());
      }
    });
  } catch(e) {
    fecharScanner();
    showToast('Câmera não disponível: ' + e.message);
  }
}

function fecharScanner() {
  if (codeReader) {
    codeReader.reset();
    codeReader = null;
  }
  const modal = document.getElementById('scanner-modal');
  if (modal) modal.remove();
}

// ENVIAR PARA ASSINATURA

async function enviarParaAssinatura() {
  const idRota = document.getElementById('id-chamado').value;
  if (!idRota) { showToast('Gere um ID Rota primeiro'); return; }
  if (!selRem)  { showToast('Selecione o Remetente'); return; }
  if (!selDest) { showToast('Selecione o Destinatário'); return; }

  // Coleta itens
  const itens = [];
  document.querySelectorAll('.item-row').forEach(row => {
    const id = row.id.replace('item-','');
    itens.push({
      chamado: document.getElementById(`item-${id}-chamado`).value,
      produto: document.getElementById(`prod-${id}-text`).textContent,
      tag:     document.getElementById(`item-${id}-tag`).value,
      qtd:     document.getElementById(`item-${id}-qtd`).value || '1',
      valor:   document.getElementById(`item-${id}-valor`).value,
    });
  });

  const payload = {
    id:   idRota,
    tipo: tipo,
    status: 'pendente',
    rem_unidade: selRem.u, rem_end: selRem.e, rem_bairro: selRem.b,
    rem_cidade: selRem.c,  rem_uf: selRem.uf, rem_cep: selRem.cep,
    rem_cnpj: selRem.cnpj, rem_cc: selRem.cc,
    dest_unidade: selDest.u, dest_end: selDest.e, dest_bairro: selDest.b,
    dest_cidade: selDest.c,  dest_uf: selDest.uf, dest_cep: selDest.cep,
    dest_cnpj: selDest.cnpj, dest_cc: selDest.cc,
    transportadora:  document.getElementById('transportadora').value,
    tipo_produto:    document.getElementById('tipo-produto').value,
    encaminhado_por: document.getElementById('encaminhado-por').value,
    solicitado_por:  document.getElementById('solicitado-por').value,
    itens: itens,
  };

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    await supaInsert(payload);

    // Monta link de assinatura
    const base = window.location.href.replace('Gerador_de_Minutas.html','').replace(/\/$/, '');
    const link = `${base}/Assinar_Minuta.html?id=${encodeURIComponent(idRota)}`;

    // Mostra modal com link
    mostrarModal(idRota, link);
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message);
    btn.disabled = false;
    btn.textContent = '✉ Enviar para Assinatura';
  }
}

function mostrarModal(idRota, link) {
  // Remove modal anterior se existir
  const old = document.getElementById('modal-link');
  if (old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'modal-link';
  modal.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;
    display:flex;align-items:center;justify-content:center;padding:16px;
  `;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px 24px;max-width:520px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.18);">
      <div style="font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#cc0000;margin-bottom:8px;">Minuta Salva</div>
      <div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">${idRota}</div>
      <div style="font-size:13px;color:#5a5a72;margin-bottom:20px;">Encaminhe o link abaixo para o recebedor assinar:</div>
      <div style="background:#f2f2f5;border-radius:9px;padding:12px 14px;font-size:12px;font-family:monospace;word-break:break-all;color:#1a1a2e;margin-bottom:16px;">${link}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button onclick="copiarLink('${link}', this)" style="padding:11px;background:#f2f2f5;border:1.5px solid #e0e0e6;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .18s;">
          📋 Copiar link
        </button>
        <button onclick="document.getElementById('modal-link').remove()" style="padding:11px;background:#cc0000;color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;font-family:'DM Sans',sans-serif;">
          Fechar
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function copiarLink(link, btn) {
  navigator.clipboard.writeText(link).then(() => {
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = '📋 Copiar link', 2000);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
