<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Relatórios — TI Minutas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --accent: #cc0000;
    --accent-light: rgba(204,0,0,0.08);
    --bg: #f2f2f5;
    --surface: #ffffff;
    --surface2: #f7f7fa;
    --border: #e0e0e6;
    --text: #1a1a2e;
    --text2: #5a5a72;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
    --green: #0a6640; --green-bg: #d1e7dd;
    --blue: #1a7acc;  --blue-bg: rgba(26,122,204,0.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 48px; }

  /* HEADER */
  .header { max-width: 1060px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo-circle { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-circle svg { width: 24px; height: 24px; fill: #fff; }
  .header-text h1 { font-size: 20px; font-weight: 700; }
  .header-text p { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--surface); color: var(--text2); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; text-decoration: none; transition: all .18s; }
  .btn-back:hover { border-color: var(--accent); color: var(--text); }
  .btn-export { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; background: var(--green); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; transition: background .18s; }
  .btn-export:hover { background: #084d30; }

  /* MAIN */
  .main { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* FILTRO PERÍODO */
  .periodo-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .periodo-card label { font-size: 12px; font-weight: 600; color: var(--text2); white-space: nowrap; }
  .date-input {
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
    outline: none; cursor: pointer; transition: border-color .18s;
  }
  .date-input:focus { border-color: var(--accent); }
  .btn-aplicar { padding: 8px 18px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; transition: background .18s; }
  .btn-aplicar:hover { background: #a80000; }
  .periodo-info { margin-left: auto; font-size: 12px; color: var(--text2); font-weight: 600; }
  .periodo-sep { font-size: 13px; color: var(--text2); font-weight: 600; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; }
  .stat .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  .stat .val { font-size: 26px; font-weight: 700; }
  .stat.total .val  { color: var(--text); }
  .stat.entrega .val { color: var(--blue); }
  .stat.devolucao .val { color: #cc6600; }
  .stat.itens .val  { color: var(--green); }

  /* CHARTS ROW */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .chart-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .chart-card-title span { font-size: 11px; font-weight: 600; color: var(--text2); margin-left: auto; }
  .chart-wrap { position: relative; height: 240px; }

  /* TABELA UNIDADES */
  .table-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1.5px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .table-header h2 { font-size: 14px; font-weight: 700; }
  .table-search { flex: 1; min-width: 180px; }
  .table-search input { width: 100%; padding: 8px 12px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; transition: border-color .18s; }
  .table-search input:focus { border-color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 500px; }
  thead tr { background: var(--surface2); }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1.5px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  td { padding: 11px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; cursor: pointer; }
  .bar-cell { display: flex; align-items: center; gap: 8px; }
  .bar { height: 8px; border-radius: 4px; background: var(--blue-bg); position: relative; flex: 1; min-width: 60px; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--blue); transition: width .4s ease; }
  .bar-num { font-size: 12px; font-weight: 700; color: var(--blue); min-width: 24px; text-align: right; }

  /* MODAL DETALHES UNIDADE */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
  .equip-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .equip-row:last-child { border-bottom: none; }
  .equip-name { flex: 1; font-size: 13px; }
  .equip-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--surface2); position: relative; }
  .equip-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
  .equip-qty { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 28px; text-align: right; }
  .btn-close-modal { width: 100%; margin-top: 20px; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 9px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; }

  /* LOADING */
  .loading-wrap { text-align: center; padding: 60px; }
  .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { font-size: 14px; color: var(--text2); margin-top: 12px; font-weight: 600; }

  /* TOAST */
  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; border-radius: 10px; padding: 12px 22px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9999; white-space: nowrap; }
  #toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .charts-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v3h2V5h14v14H5v-3H3v3c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM3 12l4 4V13h8v-2H7V8l-4 4z"/></svg>
    </div>
    <div class="header-text">
      <h1>Relatórios de Minutas</h1>
      <p>Grupo Fleury · TI End User</p>
    </div>
  </div>
  <div class="header-actions">
    <a href="Gestao_Minutas.html" class="btn-back">← Gestão</a>
    <button class="btn-export" onclick="exportarExcel()">⬇ Exportar Excel</button>
  </div>
</div>

<div class="main" id="main">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p>Carregando dados...</p>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://ipljdqgzzxtefiziptis.supabase.co';
const SUPA_KEY = 'sb_publishable_yilYz_KyV-62HueBsPNvOA_cRre6Qda';

let todasMinutas = [];
let chartDias = null;
let chartTipo = null;
let sortCol = 'total';
let sortAsc = false;
let searchQ = '';

// ── INIT ──
window.addEventListener('DOMContentLoaded', async () => {
  await carregarDados();
});

async function carregarDados() {
  try {
    const r = await fetch(
      `${SUPA_URL}/rest/v1/minutas?select=id,tipo,status,created_at,dest_unidade,rem_unidade,itens&order=created_at.asc`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!r.ok) throw new Error(await r.text());
    todasMinutas = await r.json();
    renderDashboard();
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="loading-wrap"><div style="font-size:36px">⚠️</div><p>Erro ao carregar: ${e.message}</p></div>`;
  }
}

// ── FILTROS ──
function getMesAnoOptions() {
  const meses = new Set();
  todasMinutas.forEach(m => {
    if (m.created_at) {
      const d = new Date(m.created_at);
      meses.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }
  });
  return [...meses].sort().reverse();
}

function getAnoOptions() {
  const anos = new Set();
  todasMinutas.forEach(m => {
    if (m.created_at) anos.add(new Date(m.created_at).getFullYear());
  });
  return [...anos].sort().reverse();
}

function filtrarPorPeriodo() {
  const deVal  = document.getElementById('filtro-de')?.value;
  const ateVal = document.getElementById('filtro-ate')?.value;
  if (!deVal || !ateVal) return todasMinutas;

  const de  = new Date(deVal  + 'T00:00:00');
  const ate = new Date(ateVal + 'T23:59:59');

  return todasMinutas.filter(m => {
    if (!m.created_at) return false;
    const d = new Date(m.created_at);
    return d >= de && d <= ate;
  });
}

// ── RENDER DASHBOARD ──
function renderDashboard() {
  const main = document.getElementById('main');

  // Datas padrão: primeiro dia do mês atual até hoje
  const hoje = new Date();
  const primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
  const hojeStr = hoje.toISOString().split('T')[0];

  main.innerHTML = `
    <!-- PERÍODO -->
    <div class="periodo-card">
      <label>De</label>
      <input type="date" id="filtro-de" class="date-input"/>
      <span class="periodo-sep">→</span>
      <label>Até</label>
      <input type="date" id="filtro-ate" class="date-input"/>
      <button class="btn-aplicar" onclick="atualizarDados()">Aplicar</button>
      <div class="periodo-info" id="periodo-info"></div>
    </div>    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat total"><div class="lbl">Total de Minutas</div><div class="val" id="s-total">—</div></div>
      <div class="stat entrega"><div class="lbl">📦 Entregas</div><div class="val" id="s-entrega">—</div></div>
      <div class="stat devolucao"><div class="lbl">↩ Devoluções</div><div class="val" id="s-devolucao">—</div></div>
      <div class="stat itens"><div class="lbl">🔧 Equipamentos</div><div class="val" id="s-itens">—</div></div>
    </div>

    <!-- GRÁFICOS -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-title">Minutas por Dia <span id="chart-periodo-label"></span></div>
        <div class="chart-wrap"><canvas id="chart-dias"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Entrega vs Devolução</div>
        <div class="chart-wrap"><canvas id="chart-tipo"></canvas></div>
      </div>
    </div>

    <!-- TABELA UNIDADES -->
    <div class="table-card">
      <div class="table-header">
        <h2>Equipamentos por Unidade Destinatária</h2>
        <div class="table-search">
          <input type="text" placeholder="🔍 Buscar unidade..." oninput="searchQ=this.value;renderTabela()" id="search-unid"/>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="setSortCol('unidade')">Unidade</th>
              <th onclick="setSortCol('minutas')" class="sorted">Minutas ↓</th>
              <th onclick="setSortCol('total')">Equipamentos</th>
              <th>Distribuição</th>
              <th>Tipo mais pedido</th>
            </tr>
          </thead>
          <tbody id="tbody-unidades"></tbody>
        </table>
      </div>
    </div>
  `;

  // Inicializa campos de data
  setTimeout(() => {
    document.getElementById('filtro-de').value  = primeiroDia;
    document.getElementById('filtro-ate').value = hojeStr;
    atualizarDados();
  }, 0);
}

function toggleModoFiltro() {
  const modo = document.getElementById('filtro-modo').value;
  document.getElementById('grupo-dia').style.display       = modo === 'dia'       ? 'flex' : 'none';
  document.getElementById('grupo-mes').style.display       = modo === 'mes'       ? 'flex' : 'none';
  document.getElementById('grupo-ano').style.display       = modo === 'ano'       ? 'flex' : 'none';
  document.getElementById('grupo-intervalo').style.display = modo === 'intervalo' ? 'flex' : 'none';

  // Preenche datas padrão do intervalo na primeira abertura
  if (modo === 'intervalo') {
    const hoje = new Date();
    const de  = document.getElementById('filtro-de');
    const ate = document.getElementById('filtro-ate');
    if (!de.value)  de.value  = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
    if (!ate.value) ate.value = hoje.toISOString().split('T')[0];
  }
  atualizarDados();
}

function atualizarDiasDia() {
  const ano = parseInt(document.getElementById('filtro-dia-ano').value);
  const mes = parseInt(document.getElementById('filtro-dia-mes').value);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const sel = document.getElementById('filtro-dia-dia');
  const atual = parseInt(sel.value);
  sel.innerHTML = Array.from({length: diasNoMes}, (_,i) =>
    `<option value="${i+1}" ${i+1==atual?'selected':''}>${String(i+1).padStart(2,'0')}</option>`
  ).join('');
}

function atualizarDados() {
  const filtrados = filtrarPorPeriodo();
  atualizarStats(filtrados);
  atualizarChartDias(filtrados);
  atualizarChartTipo(filtrados);
  renderTabela(filtrados);
  atualizarPeriodoInfo(filtrados);
}

/${String(m).padStart(2,'0')}/${a}`;
  } else if (modo === 'mes') {
    const a = document.getElementById('filtro-mes-ano').value;
    const m = parseInt(document.getElementById('filtro-mes-mes').value);
    label = `${MESES[m-1]}/${a}`;
  } else if (modo === 'ano') {
    label = document.getElementById('filtro-ano-ano').value;
  } else if (modo === 'intervalo') {
    const de  = document.getElementById('filtro-de').value;
    const ate = document.getElementById('filtro-ate').value;
    const fmt = v => v ? v.split('-').reverse().join('/') : '?';
    label = `${fmt(de)} a ${fmt(ate)}`;
  }
  document.getElementById('periodo-info').textContent =
    `${filtrados.length} minuta${filtrados.length!==1?'s':''} · ${label}`;
}

// ── STATS ──
function atualizarStats(minutas) {
  const totalItens = minutas.reduce((acc, m) => {
    return acc + (m.itens||[]).reduce((s, it) => s + (parseInt(it.qtd)||1), 0);
  }, 0);
  document.getElementById('s-total').textContent    = minutas.length;
  document.getElementById('s-entrega').textContent  = minutas.filter(m => m.tipo==='Entrega').length;
  document.getElementById('s-devolucao').textContent= minutas.filter(m => m.tipo==='Devolucao').length;
  document.getElementById('s-itens').textContent    = totalItens;
}

// ── CHART DIAS ──
function atualizarChartDias(minutas) {
  const contagem = {};
  const deVal  = document.getElementById('filtro-de')?.value  || '';
  const ateVal = document.getElementById('filtro-ate')?.value || '';
  const de  = new Date(deVal  + 'T00:00:00');
  const ate = new Date(ateVal + 'T23:59:59');
  const diffDias = deVal && ateVal ? (ate - de) / (1000*60*60*24) : 30;

  minutas.forEach(m => {
    if (!m.created_at) return;
    const d = new Date(m.created_at);
    let key;
    if (diffDias <= 1) {
      key = `${String(d.getHours()).padStart(2,'0')}h`;
    } else if (diffDias <= 60) {
      key = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    } else {
      key = new Date(d.getFullYear(), d.getMonth()).toLocaleString('pt-BR', {month:'short', year:'2-digit'});
    }
    contagem[key] = (contagem[key]||0) + 1;
  });

  const labels = Object.keys(contagem);
  const valores = Object.values(contagem);

  const ctx = document.getElementById('chart-dias').getContext('2d');
  if (chartDias) chartDias.destroy();
  chartDias = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Minutas',
        data: valores,
        backgroundColor: 'rgba(204,0,0,0.75)',
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } },
        y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: 'DM Sans', size: 11 } }, grid: { color: '#f0f0f4' } }
      }
    }
  });

  const diffC = diffDias;
  document.getElementById('chart-periodo-label').textContent =
    diffC <= 1 ? '(por hora)' : diffC <= 60 ? '(por dia)' : '(por mês)';
}

// ── CHART TIPO ──
function atualizarChartTipo(minutas) {
  const entregas   = minutas.filter(m => m.tipo === 'Entrega').length;
  const devolucoes = minutas.filter(m => m.tipo === 'Devolucao').length;

  const ctx = document.getElementById('chart-tipo').getContext('2d');
  if (chartTipo) chartTipo.destroy();
  chartTipo = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Entrega', 'Devolução'],
      datasets: [{
        data: [entregas, devolucoes],
        backgroundColor: ['rgba(26,122,204,0.85)', 'rgba(204,102,0,0.85)'],
        borderWidth: 0,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 12 }, padding: 16 } }
      },
      cutout: '65%'
    }
  });
}

// ── TABELA UNIDADES ──
function calcUnidades(minutas) {
  const mapa = {};
  minutas.forEach(m => {
    const unid = m.dest_unidade || '(não informado)';
    if (!mapa[unid]) mapa[unid] = { unidade: unid, minutas: 0, total: 0, equipamentos: {} };
    mapa[unid].minutas++;
    (m.itens||[]).forEach(it => {
      const qtd = parseInt(it.qtd)||1;
      mapa[unid].total += qtd;
      const prod = it.produto || 'Outros';
      mapa[unid].equipamentos[prod] = (mapa[unid].equipamentos[prod]||0) + qtd;
    });
  });
  return Object.values(mapa);
}

function setSortCol(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = false; }
  renderTabela();
}

function renderTabela(minutas) {
  if (!minutas) minutas = filtrarPorPeriodo();
  let dados = calcUnidades(minutas);

  // Filtro busca
  if (searchQ) {
    const q = searchQ.toLowerCase();
    dados = dados.filter(d => d.unidade.toLowerCase().includes(q));
  }

  // Ordenação
  dados.sort((a, b) => {
    const va = a[sortCol] ?? 0, vb = b[sortCol] ?? 0;
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });

  const maxTotal = Math.max(...dados.map(d => d.total), 1);

  if (!dados.length) {
    document.getElementById('tbody-unidades').innerHTML =
      `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text2)">Nenhum dado encontrado</td></tr>`;
    return;
  }

  document.getElementById('tbody-unidades').innerHTML = dados.map(d => {
    const topEquip = Object.entries(d.equipamentos).sort((a,b)=>b[1]-a[1])[0];
    const pct = Math.round((d.total / maxTotal) * 100);
    return `<tr onclick="abrirDetalheUnidade('${d.unidade.replace(/'/g,"\\'")}')">
      <td style="font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${d.unidade}">${d.unidade}</td>
      <td style="font-weight:700;color:var(--text2)">${d.minutas}</td>
      <td style="font-weight:700">${d.total}</td>
      <td>
        <div class="bar-cell">
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-num">${pct}%</div>
        </div>
      </td>
      <td style="font-size:12px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${topEquip?topEquip[0]:'—'}">
        ${topEquip ? `${topEquip[0]} <strong style="color:var(--accent)">(${topEquip[1]})</strong>` : '—'}
      </td>
    </tr>`;
  }).join('');
}

// ── DETALHE UNIDADE ──
function abrirDetalheUnidade(unidade) {
  const minutas = filtrarPorPeriodo();
  const dados = calcUnidades(minutas).find(d => d.unidade === unidade);
  if (!dados) return;

  const equips = Object.entries(dados.equipamentos).sort((a,b) => b[1]-a[1]);
  const maxQtd = equips[0]?.[1] || 1;

  const rows = equips.map(([nome, qtd]) => `
    <div class="equip-row">
      <div class="equip-name">${nome}</div>
      <div class="equip-bar"><div class="equip-bar-fill" style="width:${Math.round(qtd/maxQtd*100)}%"></div></div>
      <div class="equip-qty">${qtd}</div>
    </div>`).join('');

  const old = document.getElementById('modal-detalhe');
  if (old) old.remove();

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'modal-detalhe';
  modal.innerHTML = `
    <div class="modal">
      <h3>${unidade}</h3>
      <div class="modal-sub">${dados.minutas} minuta${dados.minutas!==1?'s':''} · ${dados.total} equipamento${dados.total!==1?'s':''}</div>
      ${rows || '<p style="color:var(--text2);font-size:13px">Nenhum equipamento registrado</p>'}
      <button class="btn-close-modal" onclick="document.getElementById('modal-detalhe').remove()">Fechar</button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

// ── EXPORTAR EXCEL ──
function exportarExcel() {
  const minutas = filtrarPorPeriodo();
  if (!minutas.length) { showToast('Nenhum dado para exportar'); return; }

  const wb = XLSX.utils.book_new();

  // Aba 1: Minutas do período
  const rows1 = [['ID Rota','Tipo','Status','Data','Remetente','Destinatário','Transportadora','Encaminhado por','Solicitado por','Itens (qtd)']];
  minutas.forEach(m => {
    const totalItens = (m.itens||[]).reduce((s,it) => s+(parseInt(it.qtd)||1), 0);
    const data = m.created_at ? new Date(m.created_at).toLocaleString('pt-BR') : '';
    rows1.push([m.id, m.tipo, m.status, data, m.rem_unidade||'', m.dest_unidade||'', '', '', '', totalItens]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols'] = [22,12,12,18,30,30,18,20,20,10].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Minutas');

  // Aba 2: Itens detalhados
  const rows2 = [['ID Rota','Destinatário','Produto','TAG / Serial','Qtd','Valor']];
  minutas.forEach(m => {
    (m.itens||[]).forEach(it => {
      rows2.push([m.id, m.dest_unidade||'', it.produto||'', it.tag||'', parseInt(it.qtd)||1, it.valor||'']);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols'] = [22,30,35,18,8,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws2, 'Itens Detalhados');

  // Aba 3: Ranking unidades
  const unidades = calcUnidades(minutas).sort((a,b) => b.total - a.total);
  const rows3 = [['Unidade Destinatária','Minutas','Total Equipamentos','Equipamento mais pedido','Qtd']];
  unidades.forEach(d => {
    const top = Object.entries(d.equipamentos).sort((a,b)=>b[1]-a[1])[0];
    rows3.push([d.unidade, d.minutas, d.total, top?top[0]:'', top?top[1]:0]);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(rows3);
  ws3['!cols'] = [35,10,18,35,8].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws3, 'Ranking Unidades');

  // Aba 4: Equipamentos por unidade (detalhado)
  const rows4 = [['Unidade Destinatária','Equipamento','Quantidade']];
  unidades.forEach(d => {
    Object.entries(d.equipamentos).sort((a,b)=>b[1]-a[1]).forEach(([equip, qtd]) => {
      rows4.push([d.unidade, equip, qtd]);
    });
  });
  const ws4 = XLSX.utils.aoa_to_sheet(rows4);
  ws4['!cols'] = [35,35,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws4, 'Equip por Unidade');

  // Nome do arquivo com período
  const modo = document.getElementById('filtro-modo')?.value || 'mes';
  const periodo = `${(document.getElementById('filtro-de')?.value||'').replace(/-/g,'')}_a_${(document.getElementById('filtro-ate')?.value||'').replace(/-/g,'')}`;
  const fname = `Relatorio_Minutas_${periodo}.xlsx`;

  XLSX.writeFile(wb, fname);
  showToast('Excel exportado com sucesso!');
}

function atualizarPeriodoInfo(filtrados) {
  const de  = document.getElementById('filtro-de')?.value || '';
  const ate = document.getElementById('filtro-ate')?.value || '';
  const fmt = v => v ? v.split('-').reverse().join('/') : '?';
  const label = de === ate ? fmt(de) : `${fmt(de)} a ${fmt(ate)}`;
  document.getElementById('periodo-info').textContent =
    `${filtrados.length} minuta${filtrados.length!==1?'s':''} · ${label}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
